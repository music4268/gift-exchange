<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>匿名許願交換禮物</title><style>*{box-sizing:border-box}body{margin:0;background:#123b30;color:#f8e9c8;font:16px system-ui,sans-serif}main{max-width:480px;margin:auto;padding:32px 18px}header{text-align:center;margin-bottom:25px}h1{font-size:30px;margin:10px 0}small{letter-spacing:2px}section{background:#fff9ed;color:#253e35;border-radius:20px;padding:22px;margin:14px 0;box-shadow:0 8px 30px #0002}input,textarea,select,button{font:inherit;width:100%;padding:13px;border-radius:10px;margin:8px 0;border:1px solid #c9c7b9}button{background:#a23d43;color:white;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.45}textarea{min-height:120px}label{font-weight:bold}p{line-height:1.6;overflow-wrap:anywhere}progress{width:100%;accent-color:#39795f}#error{color:#ffd0c9;white-space:pre-wrap} [hidden]{display:none!important}</style><main><header><small>✦ SECRET GIFT EXCHANGE ✦</small><h1>🎄 匿名許願交換禮物</h1><p>一個願望，一份驚喜。</p></header><p id="error" role="alert"></p><section id="home" hidden><label>參加人數（含主辦人）</label><select id="capacity"><option>9</option><option>10</option></select><button id="create">建立房間</button><hr><label>已有房間？</label><input id="code" placeholder="輸入房間代碼"><button id="enter">進入房間</button></section><section id="room" hidden><p>房間代碼：<strong id="rid"></strong></p><button id="share">複製邀請連結</button><p id="progress"></p><progress id="bar" max="10" value="0"></progress><p id="status"></p><button id="join" hidden>加入房間</button><div id="form" hidden><label>你的暱稱</label><input id="nickname" maxlength="30" placeholder="暱稱"><label>你想收到的禮物提示</label><textarea id="hint" maxlength="500" placeholder="例如：希望收到香香的東西"></textarea><button id="save">匿名送出／更新願望</button></div><button id="draw" hidden>🎁 開始抽籤</button><div id="result" hidden><h2>🎁 你的神秘任務</h2><p id="resultText" style="font-size:22px;white-space:pre-wrap"></p><p>請依照提示準備禮物，不必猜測對方是誰。</p></div><p><small>請使用原本的瀏覽器查看結果，勿清除網站資料。</small></p></section></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js';
import {getFirestore,doc,collection,getDoc,getDocs,setDoc,runTransaction,onSnapshot} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyC2qXTpkB7FVeHBKK3cdVJLBlwic_9kp3w',authDomain:'gift-exchange-d44df.firebaseapp.com',projectId:'gift-exchange-d44df',storageBucket:'gift-exchange-d44df.firebasestorage.app',messagingSenderId:'1026639365172',appId:'1:1026639365172:web:cdf6b999bc2176ef623661'}),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let uid,id,ref,data,loaded=false,own=false,hostCount=0,unsub=null;const err=e=>{$('error').textContent=e.message||String(e)};const action=(key,fn)=>$(key).onclick=async()=>{const b=$(key);b.disabled=true;$('error').textContent='';try{await fn()}catch(e){err(e)}finally{b.disabled=false;if(key==='draw')render()}};const url=()=>location.origin+location.pathname+'?room='+encodeURIComponent(id);const wish=u=>doc(ref,'wishes',u);const result=u=>doc(ref,'results',u);
function render(){if(!data)return;const member=data.members.includes(uid),host=data.hostId===uid,done=data.status==='drawn';$('join').hidden=member||done||data.members.length>=data.capacity;$('form').hidden=!member||done;$('draw').hidden=!host||done;$('draw').disabled=hostCount!==data.capacity||data.members.length!==data.capacity;$('progress').textContent=host?`已投稿 ${hostCount} / ${data.capacity} 人`:`已加入 ${data.members.length} / ${data.capacity} 人`;$('bar').max=data.capacity;$('bar').value=host?hostCount:data.members.length;$('status').textContent=done?'抽籤已完成':member?(own?'願望已送出，等待主辦人抽籤':'請填寫你的願望'):'請加入房間';if(done&&member)getDoc(result(uid)).then(s=>{if(s.exists()){$('result').hidden=false;$('resultText').textContent=s.data().hint}else err(new Error('找不到抽籤結果，請聯絡主辦人。'))}).catch(err);}
function openRoom(r){id=r;ref=doc(db,'rooms',id);$('home').hidden=true;$('room').hidden=false;$('rid').textContent=id;history.replaceState(null,'',url());onSnapshot(ref,async s=>{if(!s.exists()){err(new Error('房間不存在'));return}data=s.data();render();if(data.members.includes(uid)&&!loaded){loaded=true;try{const w=await getDoc(wish(uid));if(w.exists()){own=true;$('nickname').value=w.data().nickname;$('hint').value=w.data().hint}render()}catch(e){err(e)}}if(data.hostId===uid&&!unsub)unsub=onSnapshot(collection(ref,'wishes'),q=>{hostCount=q.docs.filter(d=>data.members.includes(d.id)).length;render()},err)},err)}
action('create',async()=>{const r=crypto.randomUUID().replaceAll('-','');await setDoc(doc(db,'rooms',r),{hostId:uid,capacity:Number($('capacity').value),status:'waiting',members:[uid]});openRoom(r)});action('enter',async()=>{const r=$('code').value.trim();if(!/^[a-f0-9]{32}$/.test(r))throw Error('房間代碼不正確');openRoom(r)});action('share',async()=>{try{await navigator.clipboard.writeText(url());$('status').textContent='已複製邀請連結'}catch{prompt('請複製邀請連結',url())}});action('join',async()=>{await runTransaction(db,async t=>{const s=await t.get(ref),d=s.data();if(d.members.includes(uid))return;if(d.status!=='waiting'||d.members.length>=d.capacity)throw Error('房間已滿或已抽籤');t.update(ref,{members:[...d.members,uid]})})});action('save',async()=>{const nickname=$('nickname').value.trim(),hint=$('hint').value.trim();if(!nickname||!hint)throw Error('請填寫暱稱及願望');await setDoc(wish(uid),{nickname,hint});own=true;render()});
function random(n){const a=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=random(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
action('draw',async()=>{if(!confirm('確定開始抽籤？完成後不能重抽。'))return;await runTransaction(db,async t=>{const s=await t.get(ref),d=s.data();if(d.hostId!==uid||d.status!=='waiting'||d.members.length!==d.capacity)throw Error('尚未符合抽籤條件');const wishes=await Promise.all(d.members.map(u=>t.get(wish(u))));if(wishes.some(w=>!w.exists()))throw Error('尚有人未投稿');let p;do{p=shuffle([...d.members])}while(p.some((u,i)=>u===d.members[i]));d.members.forEach((u,i)=>t.set(result(u),{hint:wishes[d.members.indexOf(p[i])].data().hint}));t.update(ref,{status:'drawn'})})});onAuthStateChanged(auth,u=>{if(!u)return;uid=u.uid;const r=new URLSearchParams(location.search).get('room');if(r&&/^[a-f0-9]{32}$/.test(r))openRoom(r);else $('home').hidden=false});if(!auth.currentUser)auth.authStateReady().then(()=>{if(!auth.currentUser)return signInAnonymously(auth)}).catch(err);
</script></html>
